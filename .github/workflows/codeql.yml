name: CodeQL
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "41 3 * * 2"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
