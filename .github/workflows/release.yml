# Release pipeline for munkres.
#
# Manual runs and stable vX.Y.Z / VX.Y.Z tags publish directly to PyPI.
# Stable tag pushes also create a GitHub release after successful publishing.
# Non-stable tags are rejected before package builds begin.

name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse non-stable tags and check version
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG_NAME' is not a stable vX.Y.Z tag; refusing to publish."
            exit 1
          fi
          python tools/verify_release.py --tag "$TAG_NAME"

  sdist:
    name: Build source distribution
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist

      - name: Check source distribution
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build wheels (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_i686 *-win32 *-manylinux_i686"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_TEST_REQUIRES: "pytest hypothesis numpy scipy"
          CIBW_TEST_COMMAND: >-
            python -c "from munkres import _native; assert _native.available(), 'native kernel missing from wheel'" &&
            python -m pytest {project}/tests/v3 -q -x

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  check:
    name: Check all distributions
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Validate distributions
        run: |
          python -m pip install --upgrade pip twine check-wheel-contents
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: munkres-distributions
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish directly to PyPI
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/munkres/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: munkres-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: munkres-distributions
          path: dist/

      - name: Create source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#[vV]}"
          git archive --format=zip \
            --prefix="munkres-${version}/" \
            -o "dist/munkres-${version}-source.zip" HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: munkres ${{ github.ref_name }}
          body_path: V3_RELEASE.txt
          files: dist/*
