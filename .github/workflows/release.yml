# Release pipeline for munkres.
#
#   * Pushing a plain stable tag (vX.Y.Z) builds, checks and publishes to PyPI (after approval in the
#     `pypi` environment), then creates the GitHub release with the distributions and a source archive.
#   * Running the workflow manually builds, checks and publishes a rehearsal to TestPyPI only.
#   * Tags that are not plain vX.Y.Z (rc, a, b, dev, ...) are refused before anything is built.
#
# The package has an optional C extension, so wheels are platform specific and are built with cibuildwheel.
# Unsupported platforms install from the source distribution and run in pure Python.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify the release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse pre-release tags and check the version
        if: github.event_name == 'push'
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$GITHUB_REF_NAME' is not a plain stable tag (vX.Y.Z); refusing to publish."; exit 1 ;;
          esac
          python tools/verify_release.py --tag "$GITHUB_REF_NAME"

  sdist:
    name: Source distribution
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --sdist --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v3
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_i686 *-win32 *_i686"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_TEST_REQUIRES: "pytest hypothesis numpy scipy"
          CIBW_TEST_COMMAND: >-
            python -c "from munkres import _native; assert _native.available(), 'native kernel missing from wheel'" &&
            python -m pytest {project}/tests/v3 -q -x
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  check:
    name: Check distributions
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - run: |
          python -m pip install --upgrade pip twine check-wheel-contents
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: munkres-distributions
          path: dist/

  testpypi:
    name: Rehearsal on TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/munkres/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: munkres-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/munkres/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: munkres-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: munkres-distributions
          path: dist/
      - name: Source archive (no git history)
        run: git archive --format=zip --prefix="munkres-${GITHUB_REF_NAME#v}/" -o "dist/munkres-${GITHUB_REF_NAME#v}-source.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: munkres ${{ github.ref_name }}
          body_path: V3_RELEASE.txt
          files: dist/*
