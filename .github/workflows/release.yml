name: Release

on:
push:
tags: ["[vV]*"]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
with:
persist-credentials: false

  - uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - run: python -m pip install --upgrade build twine check-wheel-contents
  - run: python -m build
  - run: python -m twine check dist/*
  - run: check-wheel-contents dist/*.whl

  - uses: actions/upload-artifact@v4
    with:
      name: dist
      path: dist/
      if-no-files-found: error

testpypi:
if: github.event_name == 'workflow_dispatch' || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev')
needs: build
runs-on: ubuntu-latest
environment: testpypi
permissions:
id-token: write
steps:
- uses: actions/download-artifact@v4
with:
name: dist
path: dist/

  - uses: pypa/gh-action-pypi-publish@release/v1
    with:
      repository-url: https://test.pypi.org/legacy/
      packages-dir: dist/

pypi:
if: github.event_name == 'push' && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b')
needs: build
runs-on: ubuntu-latest
environment: pypi
permissions:
id-token: write
steps:
- uses: actions/download-artifact@v4
with:
name: dist
path: dist/

  - uses: pypa/gh-action-pypi-publish@release/v1
    with:
      packages-dir: dist/

github-release:
if: github.event_name == 'push' && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b')
needs: pypi
runs-on: ubuntu-latest
permissions:
contents: write
steps:
- uses: actions/checkout@v4
with:
persist-credentials: false

  - uses: actions/download-artifact@v4
    with:
      name: dist
      path: dist/

  - name: Create source archive
    run: |
      version="${GITHUB_REF_NAME#v}"
      git archive --format=zip \
        --prefix="munkres-${version}/" \
        -o "dist/munkres-${version}-source.zip" HEAD

  - uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ github.ref_name }}
      name: munkres ${{ github.ref_name }}
      body_path: V3_RELEASE.txt
      files: dist/*
