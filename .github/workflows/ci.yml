name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-timeout pytest-cov hypothesis numpy scipy pandas "tomli; python_version<'3.11'"
      - run: python -m pytest --cov

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pytest-timeout pytest-cov hypothesis numpy scipy pandas ruff mypy bandit vulture codespell pdoc build twine check-wheel-contents detect-secrets
      - run: tools/audit.sh --quick

  no-optional-deps:
    name: works without numpy/pandas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest pytest-timeout
      - run: python -m munkres
      - run: cd /tmp && python -c "import munkres; print(munkres.Munkres().compute([[4,1],[2,0]]))"

  native-and-hard:
    name: native kernel + hard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-timeout hypothesis numpy scipy pandas
      - name: the C extension must have been built here
        run: python -c "from munkres import _native; assert _native.available(), 'native kernel not built'"
      - run: python -m pytest tests/v3 tests/hard -q --timeout=900

  pure-python:
    name: pure Python fallback (native disabled)
    runs-on: ubuntu-latest
    env:
      PALDITA_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pytest-timeout hypothesis numpy scipy
      - run: python -c "from munkres import _native; assert not _native.available()"
      - run: python -m pytest tests/v3 -q --timeout=900

  resilience:
    name: production safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pytest-timeout numpy scipy
      - name: fault injection - a broken, wrong or missing kernel must never change results
        run: python -m pytest tests/v3/test_resilience.py tests/v3/test_audit_fixes.py -q --timeout=600
      - name: health report is available and JSON-serialisable
        run: python -c "import json, munkres; print(json.dumps(munkres.native_status()))"

