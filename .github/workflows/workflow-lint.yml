name: Workflow lint
# Static security analysis of the workflows themselves (injection, over-broad permissions, unpinned risky triggers).
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main, master]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install zizmor pyyaml
      - name: every workflow parses and declares permissions
        run: |
          python - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              doc = yaml.safe_load(open(f))
              assert doc.get("permissions") is not None or all("permissions" in j for j in doc["jobs"].values()), f"{f}: no permissions block"
              print("ok", f)
          PY
      - run: zizmor --min-severity high .github/workflows
