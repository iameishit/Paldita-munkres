[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "munkres"
dynamic = ["version"]
description = "The Munkres (Hungarian) algorithm for the assignment problem: fast, typed, dependency-free."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE"]
authors = [
    { name = "Brian M. Clapper", email = "bmc@clapper.org" },
    { name = "Eishit Nigam" },
]
maintainers = [{ name = "Eishit Nigam" }]
keywords = [
    "munkres", "hungarian", "kuhn-munkres", "assignment problem",
    "linear assignment", "optimization", "matching", "operations research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []          # deliberately none -- the solver is pure Python

[project.scripts]
munkres = "munkres.cli:main"

[project.urls]
Homepage = "https://github.com/iameishit/Paldita-munkres"
Documentation = "https://github.com/iameishit/Paldita-munkres#readme"
Changelog = "https://github.com/iameishit/Paldita-munkres/blob/main/CHANGELOG.md"
Issues = "https://github.com/iameishit/Paldita-munkres/issues"
"Original project" = "https://software.clapper.org/munkres/"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "tomli>=2; python_version < '3.11'",
    "ruff",
    "mypy",
    "bandit",
    "vulture",
    "codespell",
    "pdoc>=14",
    "build",
    "twine",
    "check-wheel-contents",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
munkres = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "munkres.__version__" }

# ---------------------------------------------------------------- tooling ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# A hang must fail a test, never freeze CI.
timeout = 60
# An xfail that starts passing is a signal: remove the marker.
xfail_strict = true
markers = [
    "regression: guards behaviour fixed in the 2.x series",
    "packaging: checks packaging, metadata, docs and API surface",
    "performance: timing and memory budgets",
    "security: hostile input and static security checks",
]

[tool.coverage.run]
source = ["munkres"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/munkres"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM", "N", "C4", "PL", "RET", "PIE", "RUF", "PT"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test names embed issue IDs (test_B15_...), hence N802; random/pickle are fine in tests.
"tests/*" = ["S101", "S603", "S607", "S311", "S301", "S110", "E501", "PLC0415", "B905", "PT006", "PT011", "PT012", "PT017", "PT018", "RUF005", "N802", "N818", "UP031", "UP032", "C408", "SIM105"]
"examples/*" = ["S101", "S311", "T201", "E501", "PLC0415", "E402", "PLW0108"]
"benchmarks/*" = ["S101", "S311", "T201", "E501", "PLC0415", "PLR0914"]
"tools/*" = ["S101", "RUF005", "S311", "S603", "S607", "S110", "E501", "PLC0415", "T201", "SIM115", "SIM105", "PLW1510", "UP031", "UP032"]

[tool.codespell]
skip = "./.git,./build,./dist,*.lock"
